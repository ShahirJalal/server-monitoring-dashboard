<div class="host-metrics card p-3 mb-4">

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Host</h5>
        <span class="text-muted small">uptime {{ uptimeLabel }}</span>
    </div>

    <div class="alert alert-warning py-2 mb-3" *ngIf="diskWarning as disk">
        Disk usage is at {{ disk.percent?.toFixed(0) }}% ({{ disk.detail }}) -- consider clearing old
        Docker images/volumes before it fills up.
    </div>

    <div class="text-muted" *ngIf="loading">Loading host metrics...</div>

    <div class="meters" *ngIf="!loading && metrics">

        <div class="meter" *ngFor="let meter of meters">

            <div class="meter-header">
                <span class="meter-label">{{ meter.label }}</span>
                <span class="meter-detail">{{ meter.detail }}</span>
            </div>

            <div class="meter-track">
                <div class="meter-fill"
                     [class.severity-good]="meter.severity === 'good'"
                     [class.severity-warning]="meter.severity === 'warning'"
                     [class.severity-critical]="meter.severity === 'critical'"
                     [style.width.%]="meter.percent ?? 0">
                </div>
            </div>

        </div>

    </div>

</div>
