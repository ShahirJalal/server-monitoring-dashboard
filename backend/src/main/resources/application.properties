spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/monitoring}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:monitoring}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:monitoring123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Single admin account guarding create/update/delete. Override in every
# environment beyond local dev -- see docker-compose.yml / .env.example.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Comma-separated list of origins allowed to call the API directly (not needed
# in prod, where Nginx proxies /api same-origin -- see DEPLOYMENT.md section 7).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Automated health checks: how often to probe each tracked app, and the host
# they're probed on (all tracked apps are assumed to run on this same server).
app.health-check.interval-ms=${HEALTH_CHECK_INTERVAL_MS:30000}
app.health-check.timeout-ms=${HEALTH_CHECK_TIMEOUT_MS:2000}
app.health-check.host=${HEALTH_CHECK_HOST:localhost}

# ntfy.sh topic to push a notification to on every status change. Blank = no-op.
# Pick something private/hard to guess -- ntfy topics have no access control beyond
# the name itself.
app.alerts.ntfy-topic=${NTFY_TOPIC:}

# Host-level metrics, read from a bind-mounted host /proc and / (see docker-compose.yml).
# Blank/missing mounts just mean these values come back null, not a crash.
app.host-metrics.proc-path=${HOST_PROC_PATH:/host/proc}
app.host-metrics.root-path=${HOST_ROOT_PATH:/host/root}
app.host-metrics.interval-ms=${HOST_METRICS_INTERVAL_MS:15000}

# Docker socket for the host-wide container list (see docker-compose.yml). Missing
# socket just means an empty container list, not a crash.
app.docker.socket-path=${DOCKER_SOCKET_PATH:/var/run/docker.sock}
