# Test classpath takes precedence over src/main/resources, so the full
# @SpringBootTest context loads against in-memory H2 instead of a real
# Postgres instance -- CI shouldn't need a database running to build.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.admin.username=admin
app.admin.password=admin123

# Effectively disable the scheduled health-check loop during tests.
app.health-check.interval-ms=3600000
