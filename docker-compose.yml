services:

  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring123

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

  backend:

    build:
      context: ./backend

    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitoring
      SPRING_DATASOURCE_USERNAME: monitoring
      SPRING_DATASOURCE_PASSWORD: monitoring123
      # Admin login for create/update/delete -- override via a git-ignored
      # .env file in production. See .env.example.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Only matters for direct (non-proxied) API access -- see DEPLOYMENT.md section 7.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

    ports:
      - "8081:8081"

  frontend:

    build:
      context: ./frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4200:80"

volumes:
  postgres-data:
